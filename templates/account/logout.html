{% extends "base.html" %} {% block title %} Logout | RecipeHub {% endblock %} 
{% block content %}
<section class="logout-page auth-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="auth-card text-center rounded-4 shadow-sm">
          <p class="eyebrow">Account</p>

          <h1>Log out</h1>

          <p class="text-secondary mb-4">
            Are you sure you want to log out of RecipeHub?
          </p>

          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}

            <button class="btn recipe-button" type="submit">Log out</button>

            <a
              class="btn btn-outline-secondary ms-2"
              href="{% url 'recipes:home' %}"
            >
              Cancel
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
