{% extends "base.html" %}

{% block content %}

<section class="error-page pt-5">
    <div class="container">
        <div class="error-page-content text-center">

            <p class="section-label">PAGE NOT FOUND</p>

            <h1 class="error-code">404</h1>

            <h2>Oops! This recipe is missing.</h2>

            <p class="error-message">

            </p>

            <a href="/" class="btn recipe-button">
                Back to Home
            </a>

        </div>
    </div>
</section>

{% endblock %}
